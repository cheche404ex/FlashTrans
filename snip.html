<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashTrans Snip</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      body { cursor: crosshair; font-family: var(--font-body); }
      #shot {
        position: fixed; inset: 0; width: 100vw; height: 100vh;
        object-fit: fill; pointer-events: none;
      }
      #sel {
        position: fixed; display: none; pointer-events: none;
        border: 2px solid var(--accent);
        outline: 1.5px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 100000px rgba(0, 0, 0, 0.38);
      }
      #sel .size-tag {
        position: absolute; top: -28px; left: 0;
        background: var(--tint-solid); color: var(--text); font-size: 12px;
        padding: 4px 9px; border-radius: var(--radius-sm); white-space: nowrap;
        box-shadow: var(--shadow-menu); animation: tag-in var(--motion-base) var(--ease-enter) both;
      }
      #hint {
        position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
        background: var(--tint-solid); color: var(--text); font-size: 13px;
        padding: 9px 20px; border: 1px solid var(--border-strong); border-radius: 999px; pointer-events: none;
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow-menu); animation: hint-in var(--motion-emphasis) var(--ease-enter) both;
      }
      #dim-idle { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.38); pointer-events: none; }
      @keyframes hint-in { from { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(0.98); } }
      @keyframes tag-in { from { opacity: 0; transform: translateY(4px); } }
      @media (prefers-reduced-motion: reduce) { #hint, #sel .size-tag { animation: none; } }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <div id="dim-idle"></div>
    <div id="sel"><span class="size-tag" id="size-tag"></span></div>
    <div id="hint">拖动框选要识别的区域 · Esc 取消</div>
    <script type="module" src="/src/snip.ts"></script>
  </body>
</html>
