<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlashTrans Pin</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #wrap {
        width: 100vw; height: 100vh; position: relative;
        border-radius: var(--radius-lg); overflow: hidden;
        border: 2px solid var(--accent);
        box-shadow: var(--shadow-menu);
        animation: pin-in var(--motion-spring) var(--ease-enter) both;
      }
      #pin-img { width: 100%; height: 100%; object-fit: fill; display: block; -webkit-user-drag: none; }
      #bar {
        position: absolute; top: 8px; right: 8px; display: flex; gap: 6px;
        opacity: 0; transform: translateY(-5px) scale(0.98); transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-emphasis) var(--ease-spring); pointer-events: none;
      }
      #wrap:hover #bar, #wrap:focus-within #bar { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
      .pin-btn {
        width: 30px; height: 30px; border-radius: var(--radius-md); border: 0; cursor: pointer;
        background: rgba(24, 23, 21, 0.84); color: var(--text); display: grid; place-items: center;
        backdrop-filter: blur(8px); transition: background 0.15s;
      }
      .pin-btn:hover { background: var(--surface-dark-elevated, #252320); transform: translateY(-1px); }
      .pin-btn:active { transform: scale(0.9); }
      .pin-btn.close:hover { color: #fff; background: var(--danger); }
      .pin-btn svg { width: 15px; height: 15px; }
      #drag { position: absolute; inset: 0; }
      @keyframes pin-in { from { opacity: 0; transform: scale(0.96); } }
      @media (prefers-reduced-motion: reduce) { #wrap { animation: none; } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <img id="pin-img" alt="" />
      <div id="drag" data-tauri-drag-region></div>
      <div id="bar">
        <button class="pin-btn" id="pin-copy" title="复制图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="pin-btn close" id="pin-x" title="关闭 (Esc / 双击)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/pin.ts"></script>
  </body>
</html>
